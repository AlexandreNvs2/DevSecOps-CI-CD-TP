services:
  - docker:24.0.5-dind

stages:
  - lint
  - security
  - build
  - tests

# ───────── Activité 1 ─────────
flake8_code:
  stage: lint
  image: python
  before_script:
    - pip install flake8
  script:
    - flake8 "Activité1/password_check.py"
  allow_failure: true

security_code:
  stage: security
  image: python
  needs: [flake8_code]
  before_script:
    - pip install bandit
  script:
    - bandit -r "Activité1/password_check.py"
  allow_failure: true

# ───────── Activité 6 ─────────
dockerfile_lint:
  stage: lint
  image: hadolint/hadolint:2.9.2-debian
  variables:
    LANG: C.UTF-8
  script:
    - cd "Activité6"
    - hadolint Dockerfile
  allow_failure: false

image_build:
  stage: build
  image: docker:24
  script:
    - docker build --no-cache -t mynginx:1.0 "Activité6"
    - mkdir image
    - docker save mynginx > image/mynginx.tar
  artifacts:
    paths:
      - image
  allow_failure: false

image_tests:
  stage: tests
  image: docker:24
  before_script:
    - docker load -i image/mynginx.tar
  script:
    - docker run --rm --name test -it -d mynginx:1.0
    - docker exec test git version
    - docker exec test sudo service nginx start
    - docker exec test curl 127.0.0.1
    - docker exec test grep user /etc/passwd
  allow_failure: false