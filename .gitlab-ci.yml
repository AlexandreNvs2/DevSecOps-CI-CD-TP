stages:
  - lint
  - security

flake8_code:
  stage: lint
  image: python
  before_script:
    - pip install flake8
  script:
    - flake8 password_check.py
  allow_failure: true

security_code:
  stage: security
  image: python
  before_script:
    - pip install bandit
  script:
    - bandit -r password_check.py
  allow_failure: true